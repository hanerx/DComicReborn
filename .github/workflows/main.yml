name: Flutter CI & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type for manual run (release or debug)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release
      run_android:
        description: "是否运行 Android 打包"
        required: false
        default: "true"
        type: boolean
      run_ios:
        description: "是否运行 iOS 打包"
        required: false
        default: "true"
        type: boolean
      run_windows:
        description: "是否运行 Windows 打包（始终为 Release，含 portable 和安装版）"
        required: false
        default: "true"
        type: boolean
      run_macos:
        description: "是否运行 macOS 打包（始终为 Release，含 universal ZIP 和 DMG）"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  build_android:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_android == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: flutter pub get

      
      # 任意构建场景都准备 keystore 和 key.properties（如果 secrets 存在）
      - name: Prepare keystore and key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../app/my-release-key.keystore
          EOF

      - name: Build Android APK (Dev)
        if: github.ref == 'refs/heads/develop'
        run: flutter build apk --debug

      - name: Build Android APK (Release)
        if: github.ref_type == 'tag'
        run: flutter build apk --release

      - name: Build Android APK (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Upload Android APK (Dev)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android APK (Release)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}.apk
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk

  build_ios:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_ios == 'true' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          rm -rf Podfile.lock && pod install --repo-update

      # develop分支打debug
      - name: Build iOS (Dev)
        if: github.ref == 'refs/heads/develop'
        run: flutter build ios --debug --no-codesign

      # tag打release
      - name: Build iOS (Release, unsigned)
        if: github.ref_type == 'tag'
        run: flutter build ios --release --no-codesign

      # 手动触发，可选debug/release
      - name: Build iOS (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build ios --release --no-codesign
          else
            flutter build ios --debug --no-codesign
          fi

      # 统一制作ipa（所有场景）
      - name: Create IPA from Runner.app (Dev)
        if: github.ref == 'refs/heads/develop'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-debug.ipa Payload
          rm -rf Payload

      - name: Create IPA from Runner.app (Release)
        if: github.ref_type == 'tag'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-release.ipa Payload
          rm -rf Payload

      - name: Create IPA from Runner.app (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-manual.ipa Payload
          rm -rf Payload

      # 上传ipa，name带后缀
      - name: Upload iOS IPA (Dev)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug.ipa
          path: ios-debug.ipa

      - name: Upload iOS IPA (Release, unsigned)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release.ipa
          path: ios-release.ipa

      - name: Upload iOS IPA (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ios-manual.ipa
          path: ios-manual.ipa

  build_windows:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_windows == 'true' }}
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Enable plugin symlinks
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release --no-pub

      - name: Ensure Inno Setup 6 is available
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Package portable ZIP and installer EXE
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)'
          if (-not $versionLine) { throw 'Missing numeric app version in pubspec.yaml.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          .\.github\scripts\package_windows.ps1 -Version $version

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/packages/*-windows-x64-portable.zip
            build/windows/packages/*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  build_macos:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS universal Release
        run: flutter build macos --release --no-pub

      - name: Package universal ZIP and DMG
        run: |
          set -euo pipefail
          version=''
          while IFS= read -r line; do
            if [[ "$line" =~ ^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              version="${BASH_REMATCH[1]}"
              break
            fi
          done < pubspec.yaml
          [[ -n "$version" ]] || {
            echo 'Missing numeric app version in pubspec.yaml.' >&2
            exit 1
          }
          bash .github/scripts/package_macos.sh "$version"

      - name: Smoke launch packaged macOS app
        run: |
          set -euo pipefail
          app_path='build/macos/Build/Products/Release/DComicReborn.app'
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          log_path='build/macos/packages/macos-launch.log'
          "$app_path/Contents/MacOS/$executable_name" >"$log_path" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          sleep 15
          echo '--- macOS app launch log ---'
          cat "$log_path"
          echo '--- end macOS app launch log ---'
          if grep -E 'Unhandled Exception|MissingPluginException|\[core/no-app\]' "$log_path"; then
            echo 'DComicReborn reported a startup exception.' >&2
            exit 1
          fi
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || exit_code=$?
            echo "DComicReborn exited during the startup smoke check (exit ${exit_code:-unknown})." >&2
            exit 1
          fi
          ps -p "$app_pid" -o pid=,etime=,command=

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            build/macos/packages/DComicReborn-*-macos-universal.zip
            build/macos/packages/DComicReborn-*-macos-universal.dmg
          if-no-files-found: error
          compression-level: 0

  generate_release_note:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_title: ${{ steps.set_title.outputs.release_title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          VERSION="${TAG_NAME/#v/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set release title
        id: set_title
        run: |
          echo "release_title=DComicReborn v${{ steps.extract_version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Test release note generator
        run: python3 -m unittest discover -s .github/scripts -p test_generate_release_note.py -v

      - name: Generate release body from version notes and commits
        run: |
          python3 .github/scripts/generate_release_note.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes RELEASE_NOTES.md \
            --output release-note.md
      - name: Upload release-note as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-note.md
          path: release-note.md

  publish_release:
    needs: [build_android, build_ios, build_windows, build_macos, generate_release_note]
    if: >-
      ${{
        !cancelled() && github.ref_type == 'tag' &&
        needs.generate_release_note.result == 'success' &&
        !contains(needs.*.result, 'failure') &&
        (needs.build_android.result == 'success' ||
         needs.build_ios.result == 'success' ||
         needs.build_windows.result == 'success' ||
         needs.build_macos.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        if: needs.build_android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-release.apk
          path: release-assets

      - name: Download iOS IPA
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-release.ipa
          path: release-assets

      - name: Download Windows packages
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download macOS packages
        if: needs.build_macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Download release-note
        uses: actions/download-artifact@v4
        with:
          name: release-note.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          name: ${{ needs.generate_release_note.outputs.release_title }}
          body_path: release-note.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
